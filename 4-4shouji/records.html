<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>交易记录 - 融海证券</title>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">交</div><div><div class="brand-name">交易记录</div><div class="brand-sub">RECORDS</div></div></div>
  </header>
  <main class="page">
    <div class="section-head"><b>成交记录</b><a href="index.html">返回</a></div>
    <section class="card">
      <div class="record">
        <div class="r-icon">买</div>
        <div class="r-main"><b>原油主题ETF</b><span>买入成交</span></div>
        <div class="r-amt pos">7,000,000</div>
      </div>
      <div class="record">
        <div class="r-icon">持</div>
        <div class="r-main"><b>能源龙头指数</b><span>继续持有</span></div>
        <div class="r-amt pos">18,640,000</div>
      </div>
      <div class="record">
        <div class="r-icon">策</div>
        <div class="r-main"><b>商品增强策略</b><span>策略持有</span></div>
        <div class="r-amt pos">20,360,000</div>
      </div>
      <div class="record">
        <div class="r-icon">盈</div>
        <div class="r-main"><b>累计浮盈</b><span>当前账户盈亏</span></div>
        <div class="r-amt pos">39,000,000</div>
      </div>
    </section>
  </main>
  <nav class="bottom-nav">
    <a href="index.html"><i>⌂</i><span>首页</span></a>
    <a href="positions.html"><i>◎</i><span>持仓</span></a>

    <a href="market.html"><i>≈</i><span>行情</span></a>
    <a href="assets.html"><i>○</i><span>我的</span></a>
  </nav>
</div>

</html>
