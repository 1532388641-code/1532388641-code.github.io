<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>资产 - 融海证券</title>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">资</div><div><div class="brand-name">资产总览</div><div class="brand-sub">ASSETS</div></div></div>
  </header>
  <main class="page">
    <section class="asset-grid" style="margin-top:8px">
      <div class="asset-box"><span>总资产</span><b>46,000,000</b><em>账户权益</em></div>
      <div class="asset-box"><span>总盈亏</span><b style="color:var(--red)">39,000,000</b><em>累计收益</em></div>
      <div class="asset-box"><span>本金</span><b>7,000,000</b><em>累计投入</em></div>
      <div class="asset-box"><span>可用资金</span><b>2,460,000</b><em>可继续交易</em></div>
    </section>
    <section class="card">
      <div class="record">
        <div class="r-icon">收</div>
        <div class="r-main"><b>累计收益</b><span>账户运行以来</span></div>
        <div class="r-amt pos">+39,000,000</div>
      </div>
      <div class="record">
        <div class="r-icon">率</div>
        <div class="r-main"><b>累计收益率</b><span>总收益 / 本金</span></div>
        <div class="r-amt pos">+557.14%</div>
      </div>
      <div class="record">
        <div class="r-icon">值</div>
        <div class="r-main"><b>账户净值</b><span>当前净值</span></div>
        <div class="r-amt pos">6.57</div>
      </div>
    </section>
  </main>
  <nav class="bottom-nav">
    <a href="index.html"><i>⌂</i><span>首页</span></a>
    <a href="positions.html"><i>◎</i><span>持仓</span></a>
    <a href="records.html"><i>⇄</i><span>交易</span></a>
    <a href="market.html"><i>≈</i><span>行情</span></a>
    <a class="active" href="assets.html"><i>○</i><span>我的</span></a>
  </nav>
</div>
</body>
</html>
