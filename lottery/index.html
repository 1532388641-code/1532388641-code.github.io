<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#d9272e">
  <title>福利彩票</title>
  <style>
    :root{--red:#e42c32;--deep:#bf161d;--blue:#2578d8;--ink:#242424;--muted:#888;--line:#eee;--paper:#fff;--bg:#f4f4f4}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
    button{font:inherit}
    .shell{width:min(100%,430px);min-height:100vh;margin:auto;background:#f5f5f5;box-shadow:0 0 45px rgba(0,0,0,.12)}
    .topbar{height:66px;padding:9px 15px;background:#fff;display:flex;align-items:center;border-bottom:1px solid #eee}
    .mark{width:43px;height:43px;border-radius:50%;background:linear-gradient(145deg,#f0474c,var(--deep));display:grid;place-items:center;color:#fff;font-size:23px;font-weight:900;box-shadow:0 5px 12px rgba(210,24,31,.25)}
    .brand{margin-left:10px;line-height:1.05}.brand strong{display:block;color:#d11d24;font-size:20px;letter-spacing:1px}.brand small{display:block;color:#999;font-size:10px;margin-top:5px;letter-spacing:.8px}
    .more{margin-left:auto;border:0;background:transparent;font-size:26px;color:#777;letter-spacing:2px;padding:8px}
    .tabs{height:48px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #eee}
    .tabs button{border:0;background:#fff;color:#555;position:relative}.tabs .active{color:var(--red);font-weight:700}.tabs .active:after{content:"";position:absolute;bottom:0;left:28%;right:28%;height:3px;border-radius:3px;background:var(--red)}
    .hero{margin:13px;background:linear-gradient(145deg,#e63036,#bf171e);border-radius:16px;color:#fff;overflow:hidden;box-shadow:0 12px 28px rgba(191,23,30,.24)}
    .hero-head{padding:17px 17px 12px;display:flex;align-items:flex-start;justify-content:space-between}
    .lottery-name{display:flex;align-items:center;gap:8px}.mini{width:31px;height:31px;background:#fff;border-radius:50%;display:grid;place-items:center;color:#df2027;font-weight:900}.lottery-name h1{font-size:22px;margin:0}.hero-head p{margin:7px 0 0 39px;font-size:12px;opacity:.78}
    .live{font-size:12px;border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:6px 9px;background:rgba(255,255,255,.1)}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:4px;animation:pulse 1.3s infinite}
    @keyframes pulse{50%{opacity:.25}}
    .stage{background:#fff;color:var(--ink);margin:0 7px 7px;border-radius:13px;padding:22px 13px 18px;text-align:center;min-height:224px}
    .label{height:22px;margin:0 0 15px;color:#777;font-size:13px}
    .balls{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px}
    .ball{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:800;box-shadow:inset -4px -6px 8px rgba(0,0,0,.16),inset 3px 3px 6px rgba(255,255,255,.28),0 4px 8px rgba(0,0,0,.12)}
    .ball.red{background:radial-gradient(circle at 32% 27%,#fb7175,var(--red) 52%,#b70f17)}.ball.blue{background:radial-gradient(circle at 32% 27%,#70b1f5,var(--blue) 52%,#1559a7);margin-left:3px}
    .ball.spin{animation:spin .12s linear infinite}@keyframes spin{50%{transform:scale(.88);filter:blur(1px)}}
    .legend{font-size:10px;color:#aaa;margin:9px 0 17px}.legend span:last-child{margin-left:230px}
    .draw-btn,.again{width:82%;height:45px;border-radius:23px;font-weight:800}
    .draw-btn{border:0;color:#fff;background:linear-gradient(90deg,#f34449,#ca161d);box-shadow:0 7px 16px rgba(210,24,31,.28)}.draw-btn:disabled{opacity:.72}
    .again{border:1px solid #df242b;color:#d71e25;background:#fff}
    .win{display:none;margin:13px;padding:20px 15px;text-align:center;border-radius:16px;background:linear-gradient(145deg,#fff5da,#ffe5a4);border:1px solid #ffd572;box-shadow:0 9px 22px rgba(166,112,0,.12)}.win.show{display:block;animation:rise .45s ease}@keyframes rise{from{opacity:0;transform:translateY(15px)}}
    .coin{width:50px;height:50px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#f8bd27;color:#fff;font-size:27px;font-weight:900;border:5px solid #ffd96e}.win p{color:#b37400;font-size:12px;margin:10px 0 4px}.win h2{color:#b51b20;font-size:21px;margin:0}.amount{margin:10px 0;color:#b51b20}.amount span{font-size:12px}.amount strong{font-size:34px;margin:0 5px}.amount em{font-style:normal;font-size:13px}.win small{font-size:10px;color:#8c7250}
    .card{margin:13px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 13px rgba(0,0,0,.04)}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-title h2{font-size:17px;margin:0}.status{font-size:11px;color:#e1262d;background:#fff0f0;padding:4px 9px;border-radius:12px}
    .ticket{border:1px dashed #e3caca;background:#fffbf8;border-radius:10px;padding:13px}.ticket-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px dashed #e9d8d0;padding-bottom:9px}.ticket-top strong{display:block;color:#d41e25}.ticket-top small{display:block;color:#999;font-size:10px;margin-top:3px}.ticket-top>span{font-size:11px;color:#999}
    .ticket-line{display:flex;gap:5px;align-items:center;padding:13px 0}.ticket-line b{font-size:11px;color:#aaa;margin-right:2px}.ticket-line .ball,.history .ball{width:27px;height:27px;font-size:11px;box-shadow:none}.ticket-meta{display:flex;justify-content:space-between;color:#999;font-size:11px}
    .history{display:flex;flex-direction:column}.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f1f1f1}.row:last-child{border:0}.issue strong{display:block;font-size:12px}.issue small{font-size:10px;color:#aaa}.row-balls{display:flex;gap:4px}
    footer{text-align:center;color:#999;padding:10px 0 24px;font-size:11px}footer span{display:block;margin-top:5px;font-size:10px}
    @media(max-width:360px){.ball{width:35px;height:35px;font-size:14px}.balls{gap:5px}.legend span:last-child{margin-left:200px}.ticket-line .ball{width:24px;height:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="mark">彩</div>
      <div class="brand"><strong>福利彩票</strong><small>公益 · 慈善 · 健康 · 快乐</small></div>
      <button class="more" aria-label="更多">•••</button>
    </header>
    <nav class="tabs"><button>首页</button><button class="active">开奖</button><button>查询</button><button>资讯</button></nav>
    <section class="hero">
      <div class="hero-head">
        <div><div class="lottery-name"><span class="mini">双</span><h1>双色球</h1></div><p>本期开奖</p></div>
        <span class="live"><i></i>开奖直播</span>
      </div>
      <div class="stage">
        <p class="label" id="label">点击下方按钮开始开奖</p>
        <div class="balls" id="balls"></div>
        <div class="legend"><span>红球</span><span>蓝球</span></div>
        <button class="draw-btn" id="draw">点击开奖</button>
      </div>
    </section>
    <section class="win" id="win">
      <div class="coin">¥</div><p>号码完全一致</p><h2>恭喜您中得一等奖！</h2>
      <div class="amount"><span>奖金</span><strong>5,000,000</strong><em>元</em></div>
      <small>请妥善保管中奖彩票，并于兑奖期内办理兑奖</small>
    </section>
    <section class="card">
      <div class="section-title"><h2>我的彩票</h2><span class="status" id="status">待开奖</span></div>
      <div class="ticket">
        <div class="ticket-top"><div><strong>双色球</strong><small>本期号码</small></div><span>单式票</span></div>
        <div class="ticket-line"><b>01</b><span class="ball red">03</span><span class="ball red">07</span><span class="ball red">12</span><span class="ball red">18</span><span class="ball red">24</span><span class="ball red">31</span><span class="ball blue">09</span></div>
        <div class="ticket-meta"><span>1注</span><span>合计：2元</span></div>
      </div>
    </section>
    <section class="card">
      <div class="section-title"><h2>往期开奖</h2><span style="font-size:12px;color:#999">查看更多 ›</span></div>
      <div class="history">
        <div class="row"><div class="issue"><strong>往期一</strong><small>双色球</small></div><div class="row-balls"><span class="ball red">02</span><span class="ball red">05</span><span class="ball red">11</span><span class="ball red">22</span><span class="ball red">30</span><span class="ball red">33</span><span class="ball blue">16</span></div></div>
        <div class="row"><div class="issue"><strong>往期二</strong><small>双色球</small></div><div class="row-balls"><span class="ball red">01</span><span class="ball red">06</span><span class="ball red">13</span><span class="ball red">17</span><span class="ball red">26</span><span class="ball red">29</span><span class="ball blue">08</span></div></div>
        <div class="row"><div class="issue"><strong>往期三</strong><small>双色球</small></div><div class="row-balls"><span class="ball red">04</span><span class="ball red">09</span><span class="ball red">15</span><span class="ball red">19</span><span class="ball red">27</span><span class="ball red">32</span><span class="ball blue">03</span></div></div>
      </div>
    </section>
    <footer>理性购彩 · 量力而行<span>未成年人不得购买彩票及兑奖</span></footer>
  </main>
  <script>
    (() => {
      const winning=["03","07","12","18","24","31","09"];
      const balls=document.querySelector("#balls"),label=document.querySelector("#label"),button=document.querySelector("#draw"),win=document.querySelector("#win"),status=document.querySelector("#status");
      let drawing=false,finished=false,timers=[];
      const render=(revealed=0,current=-1,rolling="?")=>{
        balls.innerHTML=winning.map((n,i)=>`<span class="ball ${i===6?"blue":"red"} ${i===current?"spin":""}">${i<revealed?n:i===current?rolling:"?"}</span>`).join("");
      };
      const clear=()=>{timers.forEach(x=>{clearTimeout(x);clearInterval(x)});timers=[]};
      const reset=()=>{clear();drawing=false;finished=false;win.classList.remove("show");status.textContent="待开奖";label.textContent="点击下方按钮开始开奖";button.textContent="点击开奖";button.className="draw-btn";button.disabled=false;render()};
      const start=()=>{
        if(drawing)return;
        if(finished){reset();return}
        drawing=true;button.disabled=true;button.textContent="正在开奖…";let revealed=0,rolling="00";
        const spin=setInterval(()=>{const max=revealed===6?16:33;rolling=String(Math.floor(Math.random()*max)+1).padStart(2,"0");render(revealed,Math.min(revealed,6),rolling)},70);timers.push(spin);
        const next=()=>{
          revealed++;render(revealed,revealed<7?revealed:-1,rolling);
          if(revealed<7){label.textContent=`正在摇出第 ${revealed+1} 个号码…`;timers.push(setTimeout(next,620))}
          else{clearInterval(spin);label.textContent="本期开奖号码";timers.push(setTimeout(()=>{drawing=false;finished=true;win.classList.add("show");status.textContent="一等奖";button.disabled=false;button.textContent="重新播放开奖";button.className="again";win.scrollIntoView({behavior:"smooth",block:"center"})},650))}
        };
        label.textContent="正在摇出第 1 个号码…";timers.push(setTimeout(next,520));
      };
      button.addEventListener("click",start);render();
    })();
  </script>
</body>
</html>
